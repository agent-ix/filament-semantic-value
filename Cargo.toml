[package]
name = "filament-semantic-value"
version = "0.1.2"
edition = "2021"
rust-version = "1.98"
description = "The shared no_std semantic-value leaf: runtime semantic values over the filament-exact kernel."
authors = ["Agent IX <peter@agent-ix.ai>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/filament-semantic-value"
publish = false

[lib]
name = "filament_semantic_value"
path = "src/lib.rs"

[dependencies]
filament-exact = { git = "https://github.com/agent-ix/filament-exact", tag = "v0.2.0" }
# The one RFC 8785 encoder, without `std`, for bounded measurement of
# structural compound-unit terms.
quire-canonical = { version = "0.3", git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

[features]
# The test-only reservation permit of `SuppliedRun`. Only a `[dev-dependencies]`
# entry enables it.
test-support = []

[dev-dependencies]
fsv-failing-allocator = { path = "tests/failing-allocator" }
allocation-counter = "0.8"
ix-trace-rs = { version = "0.1", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# `seam_probe` is a consumer-set `--cfg` (FSL FR-063); `WrongSnapshotCause`
# carries its probe variant.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(seam_probe)"] }

[lints.clippy]
all = "deny"
